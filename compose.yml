services:
  api:
    build: .
    command: uba-api
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - service-data:/app/service-data
      - artifacts:/app/artifacts
      - results:/app/results
      - generated-reports:/app/reports/generated
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: uba-worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - service-data:/app/service-data
      - artifacts:/app/artifacts
      - results:/app/results
      - generated-reports:/app/reports/generated

volumes:
  service-data:
  artifacts:
  results:
  generated-reports:
