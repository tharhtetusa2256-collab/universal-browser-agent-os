[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-browser-agent-os"
version = "0.6.1"
description = "Tharhtet Browser Agent: an operator-owned multi-client browser-agent service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1.2,<2",
  "playwright>=1.54,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]
browser-use = [
  "browser-use[core]>=0.13.7,<0.14",
]

[project.scripts]
uba-run = "universal_browser_agent.cli:main"
uba-api = "universal_browser_agent.service.api:main"
uba-worker = "universal_browser_agent.service.worker:main"
uba-workspaces = "universal_browser_agent.workspace_cli:main"
uba-notion-read = "universal_browser_agent.notion_cli:main"
uba-secrets = "universal_browser_agent.secret_cli:main"
uba-eval = "universal_browser_agent.evals:run_cli"
uba-browser-use = "universal_browser_agent.browser_use_cli:main"
uba-route = "universal_browser_agent.router_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
