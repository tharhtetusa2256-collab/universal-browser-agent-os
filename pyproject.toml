[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-browser-agent-os"
version = "0.2.0"
description = "A safety-gated, read-only Playwright runtime for validated browser tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.23,<5",
  "playwright>=1.54,<2",
]

[project.scripts]
uba-run = "universal_browser_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
