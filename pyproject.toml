[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-browser-agent-os"
version = "0.4.0"
description = "Tharhtet Browser Agent: an operator-owned multi-client browser-agent service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "playwright>=1.54,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]

[project.scripts]
uba-run = "universal_browser_agent.cli:main"
uba-api = "universal_browser_agent.service.api:main"
uba-worker = "universal_browser_agent.service.worker:main"
uba-workspaces = "universal_browser_agent.workspace_cli:main"
uba-notion-read = "universal_browser_agent.notion_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
